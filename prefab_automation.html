<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Prefab Creator - Genie QuriousBit</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981;
            --secondary: #00f5d4;
            --bg-color: #0b0914;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            background-image: url('bg.jpg');
            background-size: cover; background-position: center;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
            color: #ffffff;
        }

        .header-bar {
            width: 100%;
            padding: 16px 32px;
            background: rgba(15, 12, 29, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-back {
            color: white; text-decoration: none;
            font-weight: 600; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
            opacity: 0.8; transition: opacity 0.3s;
        }
        .nav-back:hover { opacity: 1; color: var(--secondary); }

        .main-content {
            flex: 1;
            width: 100%;
            height: calc(100vh - 70px);
            position: relative;
            z-index: 10;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="prefab.html" class="nav-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            BACK TO PREFAB CREATOR
        </a>

        <div class="header-title">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            AUTOMATED PREFAB CREATOR STUDIO
        </div>
    </div>

    <div class="main-content">
        <iframe src="http://localhost:5173/?mode=prefab" title="Prefab Creation Studio"></iframe>
    </div>

</body>
</html>
