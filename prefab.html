<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prefab Creator - Genie QuriousBit</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981;
            --secondary: #00f5d4;
            --bg-color: #0b0914;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            background-image: url('bg.jpg');
            background-size: cover; background-position: center;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            color: #ffffff;
        }

        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        .ui-container {
            position: relative; z-index: 10;
            background: rgba(15, 12, 29, 0.5);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.3); border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px; padding: 4rem 5rem; text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(16, 185, 129, 0.2);
            animation: fadeIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            max-width: 800px; width: 90%; transform: translateY(20px); opacity: 0;
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        h1 {
            font-size: 3.5rem; font-weight: 700; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 1px; text-shadow: 0 0 40px rgba(0, 245, 212, 0.3);
        }

        .subtitle { font-size: 1.2rem; font-weight: 300; color: rgba(255, 255, 255, 0.7); margin-bottom: 3.5rem; letter-spacing: 5px; text-transform: uppercase; }

        .btn-group { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }

        .glass-btn {
            position: relative; background: rgba(255, 255, 255, 0.03); color: #fff;
            padding: 1.2rem 2.2rem; font-size: 1.1rem; font-weight: 500; letter-spacing: 2px;
            border-radius: 12px; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); overflow: hidden; z-index: 1;
        }

        .glass-btn::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(0, 245, 212, 0.4));
            z-index: -1; opacity: 0; transition: opacity 0.4s ease;
        }

        .glass-btn:hover {
            transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4), 0 0 20px rgba(0, 245, 212, 0.2);
        }

        .glass-btn:hover::before { opacity: 1; }
        .glass-btn:hover .icon { transform: scale(1.1) rotate(5deg); }
        .icon { width: 36px; height: 36px; transition: transform 0.3s; }
        
        .nav-back {
            position: absolute; top: 2rem; left: 2rem; color: white; text-decoration: none;
            font-weight: 500; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
            opacity: 0.7; transition: opacity 0.3s; z-index: 20;
        }
        .nav-back:hover { opacity: 1; }
    </style>
</head>
<body>

    <a href="index.html" class="nav-back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        BACK
    </a>

    <canvas id="canvas"></canvas>

    <div class="ui-container">
        <h1>Prefab Creator</h1>
        <div class="subtitle">Select Execution Mode</div>
        
        <div class="btn-group">
            <a href="prefab_automation.html" class="glass-btn" style="border-color: #10b981;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                ASSETS CUTS PREFAB
            </a>

            <a href="font_check.html" class="glass-btn" style="border-color: #3b82f6;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 7 4 4 20 4 20 7"></polyline>
                    <line x1="9" y1="20" x2="15" y2="20"></line>
                    <line x1="12" y1="4" x2="12" y2="20"></line>
                </svg>
                FONT CHECKS
            </a>

            <a href="tracking_date.html" class="glass-btn" style="border-color: #ec4899;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                TRACKING DATE
            </a>
        </div>
    </div>

    <script>
        // Background particles
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;
        function init() {
            width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 50; i++) particles.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random()-0.5), vy: (Math.random()-0.5), c: Math.random() > 0.5 ? '#10b981' : '#00f5d4' });
        }
        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let p of particles) {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>width) p.vx*=-1; if(p.y<0 || p.y>height) p.vy*=-1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fillStyle=p.c; ctx.fill();
            }
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', init);
        init(); animate();
    </script>
</body>
</html>
