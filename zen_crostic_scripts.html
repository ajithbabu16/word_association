<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Crostics - Script Execute</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #9d4edd; --secondary: #00f5d4; --bg-color: #0b0914; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; min-height: 100vh; background-color: var(--bg-color); background-image: url('bg.jpg'); background-size: cover; background-position: center; font-family: 'Outfit', sans-serif; display: flex; align-items: center; justify-content: center; color: #ffffff; }
        .ui-container { position: relative; z-index: 10; background: rgba(15, 12, 29, 0.65); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.3); border-left: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 3rem 4rem; text-align: center; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(157, 78, 221, 0.2); max-width: 650px; width: 90%; animation: fadeIn 0.8s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; background: linear-gradient(135deg, #fff, var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 1rem; font-weight: 300; color: rgba(255, 255, 255, 0.7); margin-bottom: 2rem; letter-spacing: 3px; text-transform: uppercase; }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: rgba(255,255,255,0.8); font-weight: 500; letter-spacing: 1px; }
        select, input[type="file"] { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 1rem; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 1rem; outline: none; transition: border-color 0.3s; }
        select:focus, input[type="file"]:focus { border-color: var(--secondary); }
        select option { background: #111; color: white; }
        .glass-btn { position: relative; background: rgba(255, 255, 255, 0.05); color: #fff; padding: 1rem 2rem; font-size: 1.1rem; font-weight: 500; letter-spacing: 2px; border-radius: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; width: 100%; gap: 12px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); transition: all 0.4s; margin-top: 1rem; }
        .glass-btn::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, rgba(157, 78, 221, 0.4), rgba(0, 245, 212, 0.4)); z-index: -1; opacity: 0; transition: opacity 0.4s; }
        .glass-btn:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 10px 25px rgba(157, 78, 221, 0.4); }
        .glass-btn:hover::before { opacity: 1; }
        .glass-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 1.5rem; font-weight: 300; min-height: 24px; }
        .error { color: #ff4d4d; }
        .success { color: var(--secondary); }
        .nav-back { position: absolute; top: 2rem; left: 2rem; color: white; text-decoration: none; font-weight: 500; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; opacity: 0.7; transition: opacity 0.3s; }
        .nav-back:hover { opacity: 1; }
        .progress-bar-container { width: 100%; background: rgba(255,255,255,0.1); border-radius: 8px; margin-top: 1rem; display: none; overflow: hidden; }
        .progress-bar { height: 6px; background: var(--secondary); width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px var(--secondary); }
    </style>
</head>
<body>

    <a href="zen_crostic.html" class="nav-back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        BACK
    </a>

    <div class="ui-container">
        <h1>Script Execute</h1>
        <div class="subtitle">Zen Crostics Validators</div>
        
        <div class="form-group">
            <label>1. Select Validator Script</label>
            <select id="script-select" onchange="toggleFolders()">
                <option value="zencrostic_mainvalidator.py">Main Validator (CSV/XLSX to CSV)</option>
                <option value="zencrostic_dailypuzzlevalidator.py">Daily Puzzle Validator (CSV/XLSX to CSV)</option>
                <option value="zencrostic_packspuzzlevalidator.py">Pack Validator (CSV/XLSX to CSV)</option>
                <option value="zenvalidatorBonus.py">Bonus Validator (CSV/XLSX to CSV)</option>
                <option value="generate_bonus_pdf.py">Bonus PDF Validator (CSV to PDF)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>2. Upload Input File (.csv or .xlsx)</label>
            <input type="file" id="file-input" accept=".csv,.xlsx">
        </div>
        
        <div class="form-group" id="folder-group" style="display: none;">
            <label>3. Upload "Bonus Puzzle images" Folder</label>
            <input type="file" id="folder-input" webkitdirectory directory multiple>
        </div>
        
        <button id="run-btn" class="glass-btn" onclick="runScript()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            EXECUTE
        </button>
        
        <div class="progress-bar-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <a id="download-btn" class="glass-btn" style="display: none; background: rgba(0, 245, 212, 0.1);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            DOWNLOAD RESULT
        </a>
        
        <div id="status">Ready</div>
    </div>

    <script>
        function toggleFolders() {
            const script = document.getElementById('script-select').value;
            const folderGroup = document.getElementById('folder-group');
            if (script === 'zenvalidatorBonus.py' || script === 'generate_bonus_pdf.py') {
                folderGroup.style.display = 'block';
            } else {
                folderGroup.style.display = 'none';
            }
        }
        
        // Convert a file to Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({ name: file.webkitRelativePath || file.name, content: reader.result.split(',')[1] });
                reader.onerror = error => reject(error);
            });
        }

        async function runScript() {
            const scriptName = document.getElementById('script-select').value;
            const fileInput = document.getElementById('file-input');
            const folderInput = document.getElementById('folder-input');
            const statusDiv = document.getElementById('status');
            const runBtn = document.getElementById('run-btn');
            const downloadBtn = document.getElementById('download-btn');
            const pContainer = document.getElementById('progress-container');
            const pBar = document.getElementById('progress-bar');
            
            if (!fileInput.files[0]) {
                statusDiv.innerHTML = '<span class="error">Please upload a .csv or .xlsx file.</span>';
                return;
            }
            
            let requiresFolder = (scriptName === 'zenvalidatorBonus.py' || scriptName === 'generate_bonus_pdf.py');
            if (requiresFolder && folderInput.files.length === 0) {
                statusDiv.innerHTML = '<span class="error">Please upload the Bonus Puzzle images folder.</span>';
                return;
            }

            runBtn.disabled = true;
            downloadBtn.style.display = 'none';
            pContainer.style.display = 'block';
            pBar.style.width = '10%';
            statusDiv.innerHTML = 'Reading files...';
            
            try {
                let mainFile = await fileToBase64(fileInput.files[0]);
                let imageFiles = [];
                
                if (requiresFolder) {
                    statusDiv.innerHTML = 'Processing images (this may take a moment)...';
                    for (let i = 0; i < folderInput.files.length; i++) {
                        let f = folderInput.files[i];
                        if (f.name.endsWith('.png') || f.name.endsWith('.jpg')) {
                            imageFiles.push(await fileToBase64(f));
                        }
                    }
                }
                
                pBar.style.width = '40%';
                statusDiv.innerHTML = 'Executing script on server...';

                const res = await fetch('http://localhost:8080/api/zen-crostic-run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        script: scriptName,
                        filename: fileInput.files[0].name,
                        content: mainFile.content,
                        images: imageFiles
                    })
                });
                
                pBar.style.width = '90%';
                const data = await res.json();
                
                if (!res.ok || data.error) {
                    throw new Error(data.error || "Unknown server error");
                }
                
                pBar.style.width = '100%';
                statusDiv.innerHTML = '<span class="success">Script executed successfully!</span>';
                
                // Decode base64 and trigger download
                const byteCharacters = atob(data.output_content);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                let mimeType = data.output_filename.endsWith('.pdf') ? 'application/pdf' : 
                               data.output_filename.endsWith('.xlsx') ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : 
                               'text/csv';
                
                const blob = new Blob([byteArray], { type: mimeType });
                const downloadUrl = URL.createObjectURL(blob);
                
                downloadBtn.href = downloadUrl;
                downloadBtn.download = data.output_filename;
                downloadBtn.style.display = 'inline-flex';
                
            } catch (err) {
                pBar.style.width = '0%';
                statusDiv.innerHTML = `<span class="error">Error: ${err.message}</span>`;
            } finally {
                runBtn.disabled = false;
                setTimeout(() => { pContainer.style.display = 'none'; pBar.style.width = '0%'; }, 2000);
            }
        }
    </script>
</body>
</html>
