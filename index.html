<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genie QuriousBit Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #9d4edd;
            --secondary: #00f5d4;
            --bg-color: #0b0914;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        /* Canvas Particle System */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Let clicks pass through */
        }

        /* Glassmorphism UI */
        .ui-container {
            position: relative;
            z-index: 10;
            background: rgba(15, 12, 29, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 4rem 5rem;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(157, 78, 221, 0.2);
            animation: fadeIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            max-width: 800px;
            width: 90%;
            transform: translateY(20px);
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 0 40px rgba(0, 245, 212, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 3.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            gap: 2rem;
            justify-content: center;
        }

        .glass-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            padding: 1.2rem 3rem;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 2px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            z-index: 1;
        }

        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.4), rgba(0, 245, 212, 0.4));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .glass-btn:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(157, 78, 221, 0.4), 0 0 20px rgba(0, 245, 212, 0.2);
            color: #fff;
        }

        .glass-btn:hover::before {
            opacity: 1;
        }

        .glass-btn:hover .icon {
            transform: scale(1.1) rotate(5deg);
        }

        .icon {
            width: 36px;
            height: 36px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 6px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Particle Background -->
    <canvas id="canvas"></canvas>

    <!-- Glassmorphism UI -->
    <div class="ui-container">
        <h1>Genie QuriousBit</h1>
        <div class="subtitle">Automation Core</div>
        
        <div class="btn-group">
            <a href="http://localhost:8080" class="glass-btn">
                <img class="icon" src="debug_app/Codewords_img.webp" alt="Codewords Icon" />
                CODEWORDS
            </a>
            
            <a href="http://localhost:5173" class="glass-btn">
                <img class="icon" src="debug_app/WordAssociation_img.webp" alt="Word Association Icon" />
                WORD ASSOCIATION
            </a>
        </div>
    </div>

    <!-- Particle System Logic -->
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, particles;
        
        // Setup canvas size
        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            // Create particles
            const particleCount = Math.min(width * height / 15000, 100);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.radius = Math.random() * 2 + 1;
                this.color = Math.random() > 0.5 ? '#9d4edd' : '#00f5d4';
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
            }
        }
        
        let mouseX = -1000;
        let mouseY = -1000;
        
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw particles and lines
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                // Connect particles to each other
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 245, 212, ${1 - dist/150})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
                
                // Connect particles to mouse
                const dxMouse = particles[i].x - mouseX;
                const dyMouse = particles[i].y - mouseY;
                const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                
                if (distMouse < 200) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(mouseX, mouseY);
                    ctx.strokeStyle = `rgba(157, 78, 221, ${1 - distMouse/200})`;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', init);
        
        // Start
        init();
        animate();
    </script>
</body>
</html>
